apiVersion: v1
kind: Namespace
metadata:
  name: emotion-care
  labels:
    app.kubernetes.io/name: emotion-care
    app.kubernetes.io/part-of: emotion-care-platform
---
apiVersion: v1
kind: LimitRange
metadata:
  name: emotion-care-limits
  namespace: emotion-care
spec:
  limits:
    - type: Container
      default:
        cpu: "1000m"
        memory: "1024Mi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"

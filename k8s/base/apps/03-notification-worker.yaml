apiVersion: apps/v1
kind: Deployment
metadata:
  name: emotion-notification-worker
  namespace: emotion-care
  labels:
    app: emotion-notification-worker
    app.kubernetes.io/name: emotion-notification-worker
    app.kubernetes.io/part-of: emotion-care-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: emotion-notification-worker
  template:
    metadata:
      labels:
        app: emotion-notification-worker
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["emotion-notification-worker"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: notification-worker
          image: emotioncare/emotion-notification-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: emotion-common-config
            - secretRef:
                name: emotion-secrets
          env:
            - name: DATABASE_URL
              value: "postgres://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=disable"
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: emotion-notification-worker-pdb
  namespace: emotion-care
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: emotion-notification-worker
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: emotion-notification-worker-hpa
  namespace: emotion-care
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: emotion-notification-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

apiVersion: apps/v1
kind: Deployment
metadata:
  name: emotion-outbox-relay
  namespace: emotion-care
  labels:
    app: emotion-outbox-relay
    app.kubernetes.io/name: emotion-outbox-relay
    app.kubernetes.io/part-of: emotion-care-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: emotion-outbox-relay
  template:
    metadata:
      labels:
        app: emotion-outbox-relay
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["emotion-outbox-relay"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: outbox-relay
          image: emotioncare/emotion-outbox-relay:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: emotion-common-config
            - secretRef:
                name: emotion-secrets
          env:
            - name: DATABASE_URL
              value: "postgres://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=disable"
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: emotion-outbox-relay-pdb
  namespace: emotion-care
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: emotion-outbox-relay
